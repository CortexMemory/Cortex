<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex x Qwerti Partnership Banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: 'Inter', sans-serif;
    }

    /* Standard Twitter Card size (1200x675) */
    .banner {
      position: relative;
      width: 1200px;
      height: 675px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Grid & Glow Backgrounds */
    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
    }

    .glow-1 {
      position: absolute;
      top: -20%;
      left: -10%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(100, 255, 156, 0.15) 0%, transparent 60%);
      z-index: 2;
    }

    .glow-2 {
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(100, 255, 156, 0.1) 0%, transparent 60%);
      z-index: 2;
    }

    /* Content Wrapper */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }

    /* Logos Row */
    .logos-container {
      display: flex;
      align-items: center;
      gap: 80px;
    }

    .logo-box {
      width: 240px;
      height: 240px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(100,255,156,0.2) inset;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .logo-box img {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }

    .cortex-img {
      border-radius: 50%;
    }

    .cross {
      color: rgba(255, 255, 255, 0.3);
      font-size: 64px;
      font-weight: 900;
    }

    /* Typography */
    .labels {
      text-align: center;
    }

    .eyebrow {
      color: #64ff9c;
      font-family: monospace;
      font-size: 24px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .title {
      color: #fff;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 28px;
      margin-top: 15px;
      font-weight: 400;
    }

    /* Hint text for user to screenshot */
    .screenshot-hint {
      position: absolute;
      top: 20px;
      color: #fff;
      background: #333;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: sans-serif;
      z-index: 100;
    }

    /* Hide hint when printing or taking screenshot usually if they frame it */
    @media print {
      .screenshot-hint { display: none; }
    }
  </style>
</head>
<body>
  
  <div class="screenshot-hint" onclick="this.style.display='none'" style="cursor:pointer;">
    Mac shortcut: Cmd + Shift + 4 (Take a screenshot of the black box area). Click this hint to hide it.
  </div>

  <div class="banner">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    
    <div class="content">
      <div class="labels">
        <div class="eyebrow">Official Partnership</div>
        <h1 class="title">Cortex Memory Protocol</h1>
        <div class="subtitle">Seamless $CORTEX Swaps & Web3 Onboarding</div>
      </div>

      <div class="logos-container">
        <!-- Cortex Logo -->
        <div class="logo-box">
          <img src="assets/cortex-logo.jpeg" alt="Cortex" class="cortex-img">
        </div>
        
        <!-- X icon -->
        <div class="cross">✕</div>
        
        <!-- Qwerti Logo -->
        <div class="logo-box">
          <img src="assets/qwerti-logo.png" alt="Qwerti">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
